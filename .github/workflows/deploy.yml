name: AWS session
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, destroy]
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-session
  cancel-in-progress: false
jobs:
  session:
    runs-on: ubuntu-latest
    environment: aws-demo
    env:
      AWS_REGION: ap-southeast-2
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_ingest_mode: ${{ vars.INGEST_MODE || 'sqs' }}
      TF_VAR_image_uri: ${{ vars.IMAGE_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && python -m pytest -q
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ap-southeast-2
      - if: inputs.action == 'deploy'
        run: bash scripts/deploy.sh
      - if: inputs.action == 'destroy'
        run: |
          terraform -chdir=infra init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=upi/demo.tfstate" -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true"
          terraform -chdir=infra apply -auto-approve -var=allow_destroy_data=true
          terraform -chdir=infra destroy -auto-approve -var=allow_destroy_data=true
