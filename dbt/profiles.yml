upi:
  target: dev
  outputs:
    dev:
      type: athena
      database: awsdatacatalog
      schema: "{{ env_var('LAKE_DATABASE') }}"
      region_name: "{{ env_var('AWS_REGION', 'ap-south-1') }}"
      s3_staging_dir: "s3://{{ env_var('LAKE_BUCKET') }}/athena-results/"
      s3_data_dir: "s3://{{ env_var('LAKE_BUCKET') }}/dbt/"
      work_group: "{{ env_var('ATHENA_WORKGROUP') }}"
      threads: 1
